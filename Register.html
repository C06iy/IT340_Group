<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Register for Dossier</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner no-mid">
      <a class="brand" href="index.html" aria-label="Dossier home">Dossier <small>dossier.org</small></a>
    </div>
  </header>
 
  <main class="auth">
    <div class="box">
      <p class="eyebrow">Free website</p>
      <h1>Register</h1>
      <form id="registerForm" novalidate>
        <div>
          <label for="regUser">Username</label>
          <div class="domain">
            <input id="regUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="yourname">
            <span>.dossier.org</span>
          </div>
        </div>
        <div>
          <label for="regPass">Password</label>
          <input id="regPass" name="password" type="password" autocomplete="new-password">
        </div>
        <div>
          <label for="regEmail">Email</label>
          <input id="regEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <p class="msg" id="regMsg" aria-live="polite"></p>
        <button class="btn wide" type="submit">Create My Site</button>
      </form>
    </div>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
